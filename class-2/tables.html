<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to: Make Tables</title>
</head>
<body>
    <table>
        <tr>
            <td> </td>
            <th colspan="4">Columns</th>
        </tr>
        <tr>
            <td> </td>
            <td> </td>
            <th>Column 1</th>
            <th>Column 2</th>
            <th>Column 3</th>
            <th>Column 4</th>
        </tr>
        <tr>
            <th rowspan="2"> Rows</th>
            <th> Row 1</th>
            <td>1 (1st row/1st column)</td>
            <td>2 (2nd row/1st column)</td>
            <td>3 (3rd row/1st column)</td>
            <td>4 (4th row/1st column)</td>

        </tr>

        <tr>
            <th>Row 2</th>
            <td>1 (1st row/2nd column)</td>
            <td>2 (2nd row/2nd column)</td>
            <td>3 (3rd row/2nd column)</td>
            <td>4 (4th row/2nd column)</td>
        </tr>

    </table>
</body>
</html>
